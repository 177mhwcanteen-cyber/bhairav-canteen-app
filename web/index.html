<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>भैरव कैंटीन</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="fonts/fonts.css">
<meta name="theme-color" content="#0f5132">
<link rel="manifest" href="manifest.webmanifest">
<script src="config.js"></script>
<script src="build.js"></script>
<script src="lib/qrcode.min.js"></script>
<script src="lib/vendor.js"></script>
<script src="se-platform.js"></script>
<script src="se-nutri.js"></script>
<style>
/* Layout: mandi-cart POS — sticky header + tabs, photo-tile grid, haldi-yellow total bar fixed at the bottom, sheets slide up */
:root{
  --bg:#f3f6ef; --surface:#ffffff; --ink:#14281d; --muted:#5d6f63; --line:#d9e3d4;
  --leaf:#1d6a44; --leaf-ink:#ffffff; --haldi:#f4b81c; --haldi-ink:#2a1d00;
  --chili:#c42f28; --chili-bg:#fde8e6; --sky:#1f5fa6; --sky-bg:#e5effa; --ok-bg:#e3f3e8;
  --ts:72%; --tl1:90%; --tl2:76%;
  --f-display:"Baloo 2","Mukta",system-ui,sans-serif;
  --f-body:"Mukta","Noto Sans Devanagari",system-ui,sans-serif;
  --r:16px; --shadow:0 1px 2px rgba(20,40,29,.06),0 6px 18px rgba(20,40,29,.08);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1712; --surface:#16221b; --ink:#e6efe8; --muted:#94a89a; --line:#273a2f;
  --leaf:#46b97c; --leaf-ink:#06140c; --haldi:#f5c53e; --haldi-ink:#231800;
  --chili:#f0675d; --chili-bg:#3a1714; --sky:#7fb3ee; --sky-bg:#14263b; --ok-bg:#163223;
  --ts:40%; --tl1:30%; --tl2:20%; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1712; --surface:#16221b; --ink:#e6efe8; --muted:#94a89a; --line:#273a2f;
  --leaf:#46b97c; --leaf-ink:#06140c; --haldi:#f5c53e; --haldi-ink:#231800;
  --chili:#f0675d; --chili-bg:#3a1714; --sky:#7fb3ee; --sky-bg:#14263b; --ok-bg:#163223;
  --ts:40%; --tl1:30%; --tl2:20%; --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 18px rgba(0,0,0,.35); color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;font-variant-numeric:tabular-nums}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--leaf)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--haldi);outline-offset:2px}
.px{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--leaf);color:var(--leaf-ink);padding-block:10px 0}
.brand{display:flex;align-items:center;gap:10px;justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1}
.logo i{font-style:normal;width:36px;height:36px;border-radius:12px;background:var(--haldi);display:grid;place-items:center;font-size:20px}
.logo small{display:block;font-family:var(--f-body);font-weight:500;font-size:11px;opacity:.8;letter-spacing:.04em}
.who{border:1px solid color-mix(in srgb,var(--leaf-ink) 35%,transparent);background:transparent;color:var(--leaf-ink);border-radius:99px;padding:4px 12px;font-size:13px;max-width:46%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:4px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;border:0;background:transparent;color:var(--leaf-ink);opacity:.75;padding:8px 12px 10px;font-weight:700;font-size:15px;border-bottom:3px solid transparent}
.tabs button[aria-selected="true"]{opacity:1;border-bottom-color:var(--haldi)}
main{padding-block:12px 140px}
.demo{background:var(--sky-bg);color:var(--sky);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:10px}
.modes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 14px;font-weight:600;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.inst[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:var(--surface)}
.chip.ud[aria-pressed="true"]{background:var(--chili);border-color:var(--chili);color:var(--surface)}
.cust{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-size:14px}
.cust select{flex:1;min-width:0;border:0;background:transparent;font-weight:700;font-size:16px}
.note{font-size:13px;color:var(--muted)}
.searchrow{display:flex;gap:8px;margin-bottom:10px}
.search{flex:1;min-width:0;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-size:16px}
.cats{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.card{position:relative;display:flex;flex-direction:column;border:0;padding:0;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);text-align:left;overflow:hidden;transition:transform .12s}
.card:active{transform:scale(.96)}
.tile{aspect-ratio:1/1;max-width:100%;display:grid;place-items:center;background:radial-gradient(circle at 50% 36%,hsl(var(--h) var(--ts) var(--tl1)),hsl(var(--h) var(--ts) var(--tl2)));overflow:hidden}
.tile .em{font-size:50px;line-height:1;filter:drop-shadow(0 6px 6px rgba(0,0,0,.22))}
.tile img{width:100%;height:100%;object-fit:cover}
.card .nm{font-family:var(--f-display);font-weight:700;font-size:16px;line-height:1.1;padding:7px 9px 0}
.card .pr{padding:0 9px 8px;font-size:14px;color:var(--muted)}
.card .pr b{color:var(--ink);font-size:15px}
.card.off{opacity:.45}
.badge{position:absolute;top:6px;right:6px;background:var(--haldi);color:var(--haldi-ink);font-weight:800;font-size:12px;border-radius:99px;padding:2px 8px;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.empty{text-align:center;padding:40px 12px;color:var(--muted)}
.empty b{display:block;font-family:var(--f-display);font-size:20px;color:var(--ink);margin-bottom:4px}
.cartbar{position:fixed;left:0;right:0;bottom:0;z-index:6;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-top:10px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.cartbtn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px;border:0;border-radius:18px;background:var(--haldi);color:var(--haldi-ink);padding:12px 18px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.cartbtn .t{font-family:var(--f-display);font-weight:800;font-size:24px;line-height:1}
.cartbtn .c{font-size:13px;font-weight:600;text-align:left}
.cartbtn .go{font-weight:800;font-size:16px}
/* sheets */
.scrim{position:fixed;inset:0;z-index:20;background:rgba(5,15,9,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow:auto;background:var(--surface);border-radius:24px 24px 0 0;padding-block:8px calc(18px + env(safe-area-inset-bottom,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.card{transition:none}}
.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sh-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.sh-head .tile{width:72px;border-radius:16px;flex:none}
.sh-head .tile .em{font-size:40px}
.sh-head h3{margin:0;font-family:var(--f-display);font-size:24px;line-height:1.1}
.x{margin-left:auto;border:0;background:var(--bg);border-radius:99px;width:36px;height:36px;font-size:18px;flex:none}
.qchips{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.qchips button{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:12px 4px;font-weight:700;font-size:16px}
.qchips button[aria-pressed="true"]{background:var(--leaf);color:var(--leaf-ink);border-color:var(--leaf)}
.stepper{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.stepper button{width:52px;height:52px;border-radius:14px;border:0;background:var(--bg);font-size:26px;font-weight:700;flex:none}
.stepper .qv{flex:1;text-align:center;font-family:var(--f-display);font-weight:800;font-size:30px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
label.fld{display:flex;flex-direction:column;gap:3px;font-size:13px;color:var(--muted);min-width:0}
.inp{width:100%;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;font-size:17px;color:var(--ink)}
.inp.bad{border-color:var(--chili);background:var(--chili-bg)}
.amtline{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0;border-top:1px dashed var(--line);margin-bottom:10px}
.amtline b{font-family:var(--f-display);font-size:30px}
.big{width:100%;border:0;border-radius:16px;padding:15px;font-weight:800;font-size:18px;background:var(--leaf);color:var(--leaf-ink)}
.big.haldi{background:var(--haldi);color:var(--haldi-ink)}
.big.ghost{background:var(--bg);color:var(--ink)}
.big:disabled{opacity:.45}
.warn{background:var(--chili-bg);color:var(--chili);border-radius:12px;padding:8px 12px;font-size:14px;font-weight:600;margin-bottom:10px}
.lines{list-style:none;margin:0 0 8px;padding:0}
.lines li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.lines .em{font-size:26px;width:32px;text-align:center}
.lines .mid{flex:1;min-width:0}
.lines .mid b{display:block;font-size:16px}
.lines .mid span{font-size:13px;color:var(--muted)}
.lines .mid span.chg{color:var(--chili);font-weight:700}
.lines .am{font-weight:800;font-size:16px}
.del{border:0;background:transparent;color:var(--muted);font-size:20px;width:30px}
.paym{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0 12px}
.paym button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 6px;font-weight:800;font-size:16px}
.paym button[aria-pressed="true"]{border-color:var(--leaf);background:var(--ok-bg)}
.paym button:disabled{opacity:.4}
.qrbox{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--sky-bg);border-radius:18px;padding:16px;margin-bottom:12px;text-align:center}
.qrbox .qr{background:#ffffff;padding:12px;border-radius:14px}
.qrbox .qr img,.qrbox .qr canvas{display:block}
.qrbox b{font-family:var(--f-display);font-size:26px;color:var(--sky)}
.done{text-align:center;padding:10px 0 4px}
.done .tick{width:64px;height:64px;border-radius:99px;background:var(--leaf);color:var(--leaf-ink);display:grid;place-items:center;font-size:34px;margin:0 auto 8px}
.receipt{border:1.5px dashed var(--line);border-radius:14px;padding:12px 14px;margin:10px 0 12px;font-size:14px}
.receipt h4{margin:0;text-align:center;font-family:var(--f-display);font-size:20px}
.receipt .meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin:4px 0 8px;flex-wrap:wrap}
.receipt table{width:100%;border-collapse:collapse}
.receipt td{padding:4px 0;border-bottom:1px dotted var(--line)}
.receipt td.r{text-align:right}
.receipt .tot td{font-weight:800;font-size:17px;border:0;padding-top:8px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
a.big{display:block;text-align:center;text-decoration:none}
/* panels */
h2.sec{font-family:var(--f-display);font-size:22px;margin:4px 0 10px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}
.kpi{background:var(--surface);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow)}
.kpi span{font-size:12px;color:var(--muted);letter-spacing:.02em}
.kpi b{display:block;font-family:var(--f-display);font-size:24px;line-height:1.1}
.kpi.hero{grid-column:1/-1;background:var(--leaf);color:var(--leaf-ink)}
.kpi.hero span{color:inherit;opacity:.85}
.kpi.hero b{font-size:34px}
.kpi.red b{color:var(--chili)}
.kpi.blue b{color:var(--sky)}
.list{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);width:100%;background:transparent;border-left:0;border-right:0;border-top:0;text-align:left}
.li:last-child{border-bottom:0}
.li .mid{flex:1;min-width:0}
.li .mid b{display:block}
.li .mid span{font-size:13px;color:var(--muted)}
.li .rt{text-align:right;font-weight:800}
.li .rt small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.pill{display:inline-block;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700}
.pill.red{background:var(--chili-bg);color:var(--chili)}
.pill.blue{background:var(--sky-bg);color:var(--sky)}
.pill.green{background:var(--ok-bg);color:var(--leaf)}
.tblwrap{overflow-x:auto;background:var(--surface);border-radius:14px;box-shadow:var(--shadow);margin-bottom:14px}
table.t{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 10px;border-bottom:1px solid var(--line)}
table.t td.n,table.t th.n{text-align:right}
table.t tr.flag td{background:var(--chili-bg)}
.daterow{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.daterow .inp{width:auto}
.setitem{display:grid;grid-template-columns:56px 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.setitem .tile{width:56px;border-radius:12px;border:0;padding:0}
.setitem .tile .em{font-size:30px}
.setitem .flds{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:6px;min-width:0}
.setitem .flds .inp{padding:7px 8px;font-size:15px}
.setitem .flds2{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap;align-items:center}
.setitem .flds2 .inp{width:auto;padding:5px 8px;font-size:14px}
.stk{position:absolute;top:6px;left:6px;background:color-mix(in srgb,var(--surface) 88%,transparent);color:var(--ink);font-weight:700;font-size:11px;border-radius:99px;padding:2px 7px}
.stk.low{background:var(--chili);color:var(--surface)}
.cinp{flex:1;min-width:0;border:0;background:transparent;font-size:16px;font-weight:600;padding:4px 0}
.cinp+.cinp{border-left:1px solid var(--line);padding-left:8px}
.lnk{border:0;background:none;color:var(--sky);font-weight:700;text-decoration:underline;padding:0;font-size:13px}
.heldrow{display:flex;gap:6px;overflow-x:auto;margin-bottom:10px;scrollbar-width:none}
.heldrow button{flex:none;border:1.5px dashed var(--sky);background:var(--sky-bg);color:var(--sky);border-radius:12px;padding:6px 10px;font-weight:700;font-size:13px;text-align:left}
.amtchips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.amtchips button{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 2px;font-weight:700;font-size:15px}
.freebtn{width:100%;border:1.5px dashed var(--line);background:transparent;border-radius:12px;padding:9px;font-weight:600;font-size:14px;margin-bottom:12px;color:var(--muted)}
.freebtn[aria-pressed="true"]{border-color:var(--chili);color:var(--chili);background:var(--chili-bg)}
.card2{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:12px 14px;margin-bottom:14px;display:grid;gap:10px}
.card2 h3{margin:0;font-family:var(--f-display);font-size:19px}
.stkrow{display:grid;grid-template-columns:44px 1fr;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line)}
.stkrow:last-child{border-bottom:0}
.stkrow .tile{width:44px;border-radius:10px}
.stkrow .tile .em{font-size:24px}
.stkf{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.stkf .inp{padding:6px 6px;font-size:15px}
.stkf label{font-size:11px}
.stkmeta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding:8px 4px 0;border-bottom:1px solid var(--line)}
.bars div{flex:1;min-width:0;background:var(--leaf);border-radius:4px 4px 0 0;position:relative}
.bars div.zero{background:var(--line)}
.barlbl{display:flex;gap:3px;font-size:10px;color:var(--muted);padding:3px 4px 0}
.barlbl span{flex:1;min-width:0;text-align:center;overflow:hidden}
.seg{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
.btabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 0 10px;border-top:1px solid color-mix(in srgb,var(--leaf-ink) 18%,transparent)}
.btab{flex:none;cursor:pointer;display:flex;align-items:center;gap:6px;border:1.5px solid color-mix(in srgb,var(--leaf-ink) 40%,transparent);background:transparent;color:var(--leaf-ink);border-radius:12px;padding:5px 6px 5px 10px;font-weight:700;font-size:13px;line-height:1.15;text-align:left;max-width:170px}
.btab span{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btab small{display:block;font-weight:800;font-size:15px}
.btab[aria-pressed="true"]{background:var(--haldi);color:var(--haldi-ink);border-color:var(--haldi)}
.btab .bx{border:0;background:transparent;color:inherit;opacity:.7;font-size:15px;width:24px;height:24px;flex:none;padding:0}
.btab.new{border-style:dashed;padding:5px 12px;font-size:14px}
.udbox{border:2px solid var(--chili);border-radius:16px;padding:12px;margin-bottom:12px;display:grid;gap:8px;background:var(--chili-bg)}
.udbox b{color:var(--chili);font-size:16px}
.udbox .inp{background:var(--surface)}
.udlist{display:grid;gap:6px}
.udlist button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;text-align:left;font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px}
.udlist button span{font-weight:500;font-size:13px;color:var(--muted)}
.row3{display:grid;grid-template-columns:1.3fr 1fr;gap:8px}
.lock{display:flex;align-items:center;gap:10px;background:var(--ok-bg);border-radius:12px;padding:10px 12px;font-size:14px}
.lock b{font-size:16px;word-break:break-all}
.scanbtn{flex:none;border:0;border-radius:12px;background:var(--leaf);color:var(--leaf-ink);font-weight:800;padding:0 14px;font-size:15px}
.code{font-family:ui-monospace,Menlo,monospace;letter-spacing:.04em}
/* v5 compact layout */
.logo{font-size:20px}.logo i{width:30px;height:30px;border-radius:10px;font-size:17px}
header{padding-block:6px 0}
.tabs{margin-top:6px}.tabs button{padding:6px 10px 8px;font-size:14px}
.btabs{padding:6px 0 8px}.btab{padding:3px 4px 3px 8px;font-size:12px}.btab small{font-size:14px}
main{padding-block:10px 120px}
.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:560px){.grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}}
.grid .card{border-radius:14px}
.grid .tile{aspect-ratio:5/4}
.grid .tile .em{font-size:32px;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2))}

/* v10 iOS-style skin: glass header, grouped surfaces, segmented control, floating capsule */
:root{--bg:#f2f2f7;--surface:#ffffff;--ink:#1c1c1e;--muted:#6c6c70;--line:#e3e3e8;--leaf:#1f7a4d;--leaf-ink:#ffffff;--haldi:#ffcc00;--haldi-ink:#2a1d00;--chili:#d70015;--chili-bg:#ffe9eb;--sky:#0064d2;--sky-bg:#e6f0fd;--ok-bg:#e4f6ea;--r:20px;--shadow:0 1px 1px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.06);--glass:rgba(242,242,247,.72)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000000;--surface:#1c1c1e;--ink:#f5f5f7;--muted:#98989f;--line:#323236;--leaf:#30d158;--leaf-ink:#00180a;--haldi:#ffd60a;--haldi-ink:#231a00;--chili:#ff6961;--chili-bg:#3a1513;--sky:#64a8ff;--sky-bg:#10233d;--ok-bg:#0f2e1a;--shadow:0 1px 1px rgba(0,0,0,.5),0 8px 24px rgba(0,0,0,.5);--glass:rgba(0,0,0,.6);color-scheme:dark}}

body{-webkit-font-smoothing:antialiased}

/* v12 "Pro" skin: deep-indigo → violet glass header, cosmic-orange cart capsule, white product studio tiles */

function today(d=new Date()){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}

function ftime(ts){const d=new Date(ts);return d.toLocaleTimeString("hi-IN",{hour:"2-digit",minute:"2-digit"})}
function fdate(s){const [y,m,d]=s.split("-");return d+"-"+m+"-"+y}
function lsGet(k){try{return localStorage.getItem(k)||""}catch(e){return ""}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function toast(m){if(document.documentElement.classList.contains("camon")){const c=$("#camlast");if(c)c.textContent=m;if(/^[✓📦]/.test(m))return}const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function insts(){return (S.settings.insts&&S.settings.insts.length)?S.settings.insts:["177 MH कैंटीन","मारवाड़ रसोई (होटल)","रामविनायक डोसा पॉइंट"]}
function item(id){return S.items.find(i=>i.id===id)}
function priceOf(it){return S.mode==="inst"?(window.SF?SF.costOf(it):(+it.cost||0)):(+it.sale||0)}
function tileHTML(it,cls=""){
  const h=it.hue??120;
  const em=`<span class="em" aria-hidden="true">${esc(it.emoji||"🛒")}</span>`;
  const psrc=SE.photoSrc(it);const img=psrc?`<img src="${esc(psrc)}" alt="" loading="lazy" decoding="async" style="position:absolute;inset:0" onerror="this.remove()">`:"";
  return `<div class="tile ${cls}" style="--h:${+h};position:relative">${em}${img}</div>`;
}
function biller(){return S.staff||S.meName||""}
function liveBills(){return S.dayBills.filter(b=>!b.cancelled)}
function soldQty(id){return r2(liveBills().reduce((a,b)=>a+b.lines.filter(l=>l.id===id).reduce((x,l)=>x+l.qty,0),0)*1000)/1000}
function stockLeft(id){const ti=item(id);if(ti&&ti.track)return r2(+(S.pstock[id]?.qty)||0);if(S.billsDate!==today())return null;const s=(S.stock.items||{})[id];if(!s||!(+s.open))return null;return r2((+s.open-(+s.waste||0)-soldQty(id))*1000)/1000}
function daysAgo(ts){return Math.floor((Date.now()-ts)/864e5)}
function udharAge(pid){const e=S.ledger.filter(l=>l.partyId===pid).sort((a,b)=>a.ts-b.ts);let run=0,since=null;e.forEach(l=>{run+=l.type==="udhar"?l.amt:-l.amt;if(run<=0.5)since=null;else if(since==null)since=l.ts});return since==null?null:daysAgo(since)}

function billList(){
  const raw=S.q.trim();let q=raw,qq=0;
  const mm=raw.match(/^(.*?[^\d\s.,])\s*(\d+(?:[.,]\d+)?)\s*(kg|किलो|कि\.?ग्रा|कि)?$/i);
  if(mm){q=mm[1].trim();qq=parseFloat(mm[2].replace(",","."))||0}
  const ql=q.toLowerCase();
  const catOk=i=>S.flt==="low"?isLow(i):S.flt==="exp"?!!expInfo(i):(S.cat==="all"||mcat(i)===S.cat)&&(S.sub==="all"||i.sub===S.sub);
  const hit=i=>String(i.name).toLowerCase().includes(ql)||String(i.hi||"").includes(q)||i.id.includes(ql)||String(i.alias||"").toLowerCase().includes(ql)||SN.en(i).toLowerCase().includes(ql)||String(i.code||"")===q||codes(i).includes(q);
  const exact=q&&S.items.find(i=>i.active!==false&&String(i.code||"")===q);
  const list=exact?[exact]:S.items.filter(i=>i.active!==false&&(q?true:catOk(i))&&(!q||hit(i)));
  if(S.sortTop){const sc=S.top7||{};list.sort((a,b)=>(sc[b.id]||0)-(sc[a.id]||0))}
  if(q)list.sort((a,b)=>(b.name.startsWith(q)?1:0)-(a.name.startsWith(q)?1:0));
  return {raw,q,qq,list};
}

/* उधार खाता: नाम + मोबाइल (ज़रूरी) + पिछला बाकी + यूनिट */
async function createParty(o){
  const name=String(o.name||"").trim(),phone=String(o.phone||"").replace(/\D/g,"").slice(-10),qtr=String(o.qtr||"").trim(),open=r2(parseFloat(String(o.open||"").replace(",","."))||0);
  if(!name){toast("नाम लिखें");return null}
  if(phone.length!==10){toast("उधार खाते के लिए 10 अंक का मोबाइल नंबर ज़रूरी है");return null}
  const dup=S.parties.find(p=>String(p.phone||"")===phone);if(dup){toast("यह नंबर पहले से "+dup.name+" के खाते में है — वही खाता लगा दिया");return dup.id}
  if(open<0){toast("पिछला बाकी 0 या उससे ज़्यादा लिखें");return null}
  const id="p"+Date.now().toString(36),d={name,phone,qtr,ts:Date.now(),by:S.uid||"",byName:biller(),...(open>0?{open}:{})};
  try{
    if(!S.demo)await S.db.collection("parties").doc(id).set(d);
    if(!S.parties.find(x=>x.id===id))S.parties.push({id,...d});
    if(open>0){const ent={ts:Date.now(),date:today(),partyId:id,partyName:name,type:"udhar",amt:open,billNo:"पिछला बाकी",note:"खाता खुलते समय पिछला बाकी",by:S.uid||"",byName:biller()};
      if(S.demo)S.ledger.push({id:"o"+id,...ent});else await S.db.collection("ledger").doc("o"+id).set(ent)}
    toast(name+" का उधार खाता बना"+(open>0?" · पिछला बाकी "+rs(open):""));return id;
  }catch(err){toast("खाता नहीं बना, दोबारा कोशिश करें");return null}
}

async function handleScan(code){
  code=String(code||"").trim();if(!code)return;
  if(S.tab==="kharid"&&window.SI&&SI.active()&&SI.scan(code))return;
  const vw=window.SF&&!S.scanIn&&!findByCode(code)?SF.parseVW(code):null;
  if(vw){if(vw.bad){beep(false);toast("लेबल का सामान (कोड "+vw.plu+") लिस्ट में नहीं");return}
    if(S.tab!=="bill"){S.tab="bill";showTab()}if(vw.it.active===false){toast(vw.it.name+" अभी बंद है");return}if(!(priceOf(vw.it)>0)){toast(vw.it.name+" का रेट नहीं डाला गया");return}
    if(vw.kind==="fix"&&vw.it.unit!=="pc"){beep(true);openQty(vw.it);return}quickAdd(vw.it,vw.qty);return}
  const it=findByCode(code);beep(!!it);
  if(!it){unknownCode(code);return}
  if(S.tab==="stock"&&window.SK&&SK.counting()){SK.scanCount(it);return}
  if(S.tab==="kharid"&&!S.scanIn&&window.SF&&SF.scanAdd){SF.scanAdd(it);return}
  if(S.scanIn){
    await adjStock([[it.id,1]],"माल आया");
    if(!S.demo){try{await S.db.collection("inward").doc("w"+Date.now().toString(36)+Math.random().toString(36).slice(2,4)).set({itemId:it.id,name:it.name,qty:1,cost:(window.SF?SF.costOf(it):(+it.cost||0)),code,date:today(),ts:Date.now(),by:S.uid||"",byName:biller()})}catch(e){}}
    toast("📦 "+it.name+" +1 · अब स्टॉक "+fq(S.pstock[it.id].qty,it.unit));if(S.tab==="day")renderDay();return}
  if(S.tab!=="bill"){S.tab="bill";showTab()}
  if(it.active===false){toast(it.name+" अभी बंद है");return}
  const p=priceOf(it);if(!(p>0)){toast(it.name+" का रेट नहीं डाला गया");return}
  if(!isPc(it.unit)){openQty(it);return}
  if(!canSell(it))return;
  const ex=S.cart.find(l=>l.id===it.id&&!l.changed&&!l.free);
  if(ex){ex.qty=r2(ex.qty+1);ex.amt=r2(ex.qty*ex.rate)}
  else S.cart.push({key:Math.random().toString(36).slice(2),id:it.id,name:it.name,emoji:it.emoji,unit:it.unit,qty:1,rate:p,board:p,cost:(window.SF?SF.costOf(it):(+it.cost||0)),changed:false,free:false,amt:p});
  clearSearch();refreshAfterCart();popItem(it.id);
  const inCart=S.cart.filter(l=>l.id===it.id).reduce((a,l)=>a+l.qty,0),left=it.track?r2((+(S.pstock[it.id]?.qty)||0)-inCart):null;
  toast("✓ "+it.name+" · "+rs(p)+(inCart>1?" · कुल "+inCart:"")+(left!=null&&left<0?" · ⚠ स्टॉक में इतना नहीं दिखता":""));
}

async function decodeImage(file){
  if("BarcodeDetector" in window){try{const bd=new BarcodeDetector();const bmp=await createImageBitmap(file);const r=await bd.detect(bmp);if(r.length)return r[0].rawValue}catch(e){}}

  const url=URL.createObjectURL(file);

}

/* keyboard-wedge scanner: very fast keys ending in Enter */
const W={buf:"",t:0,gaps:[]};
document.addEventListener("keydown",e=>{
  const now=performance.now();
  if(e.key==="Enter"){
    const b=W.buf,avg=W.gaps.length?W.gaps.reduce((a,x)=>a+x,0)/W.gaps.length:999;W.buf="";W.gaps=[];
    const inPop=document.activeElement&&document.activeElement.closest&&document.activeElement.closest("#sheet");
    if(b.length>=6&&avg<45&&!inPop){e.preventDefault();e.stopImmediatePropagation();
      const ae=document.activeElement;if(ae&&ae.tagName==="INPUT"&&ae.value.endsWith(b)){ae.value=ae.value.slice(0,-b.length);if(ae.id==="q"){S.q=ae.value}}
      handleScan(b);return}
    if(e.target&&e.target.id==="q"){const v=e.target.value.trim();if(v&&findByCode(v)){e.preventDefault();e.target.value="";S.q="";handleScan(v)}else if(/^\d{6,}$/.test(v)){e.preventDefault();e.target.value="";S.q="";renderBill();handleScan(v)}}
    return}
  if(e.key.length!==1||e.ctrlKey||e.metaKey||e.altKey)return;
  if(now-W.t>80){W.buf="";W.gaps=[]}else if(W.buf)W.gaps.push(now-W.t);
  W.buf+=e.key;W.t=now;
},true);

/* ---------- staff PIN login ---------- */
function hkey(x){let h=5381;for(const c of String(x))h=(h*33+c.codePointAt(0))>>>0;return "p"+h.toString(16)}
async function pinHash(name,pin){try{const d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("se|"+name+"|"+pin));return [...new Uint8Array(d)].map(b=>b.toString(16).padStart(2,"0")).join("")}catch(e){return "x"+hkey(name+"|"+pin)}}
function staffList(){return Array.isArray(S.settings.staff)?S.settings.staff:[]}
function sessionOk(){const n=lsGet("se_staff"),h=lsGet("se_auth");const st=staffList().find(x=>x.name===n);return !!(st&&h&&st.pinHash===h)}
function checkLock(){$("#lock").hidden=true;pinGate()}
/* कर्मचारी से PIN दिन में ज़्यादा से ज़्यादा 2 बार — हर 12 घंटे पर */
const PIN_MS=12*3600*1000;
function pinGate(){
  if(S.demo||S.isOwner||!S.uid)return;
  const h=lsGet("se_pinh"),ph=lsGet("se_pinph");if(!h||!ph)return;
  if(!lsGet("bh_pin_ts"))lsSet("bh_pin_ts",String(Date.now()));
  if(Date.now()-(+lsGet("bh_pin_ts")||0)<PIN_MS)return;
  if(document.querySelector(".pinlock"))return;
  const d=document.createElement("div");d.className="pinlock";
  d.innerHTML=`<div style="font-size:44px">🔐</div><h2 style="margin:0">${esc((b=>/जी$/.test(b)?b:b+" जी")(biller()||""))}, अपना PIN डालें</h2><p style="margin:0;opacity:.85">दिन में एक-दो बार PIN पूछा जाता है ताकि आपके नाम से कोई और बिल न बनाए।</p>
  <input id="pgIn" type="password" inputmode="numeric" maxlength="4" autocomplete="off" aria-label="4 अंक का PIN"><p id="pgErr" style="margin:0;min-height:20px;color:#fecaca;font-weight:700"></p><button class="lnk" data-pgout>दूसरे नाम से लॉगिन करें</button>`;
  document.body.appendChild(d);let bad=0;const inp=d.querySelector("#pgIn");setTimeout(()=>inp.focus(),80);
  inp.oninput=async()=>{inp.value=inp.value.replace(/\D/g,"");if(inp.value.length<4)return;
    const ok=(await SE.pinHash(ph,inp.value))===h;
    if(ok){lsSet("bh_pin_ts",String(Date.now()));lsSet("se_act",String(Date.now()));d.remove();toast("✓ स्वागत है "+(biller()||""))}
    else{bad++;inp.value="";d.querySelector("#pgErr").textContent=bad>=5?"5 बार गलत — दोबारा लॉगिन करें":"PIN गलत है ("+bad+"/5)";if(navigator.vibrate)navigator.vibrate(120);if(bad>=5)setTimeout(()=>SE.logout(),1200)}};
  d.querySelector("[data-pgout]").onclick=()=>SE.logout();
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden)pinGate()});

function outbox(){try{return JSON.parse(lsGet("se_outbox")||"[]")}catch(e){return []}}
function saveOutbox(o){lsSet("se_outbox",JSON.stringify(o))}
function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej({code:"timeout"}),ms))])}
async function commitBill(item){
  const bill=item.bill,date=bill.date,f=item.done||(item.done={});
  if(!f.b){await withTimeout(S.db.collection("days/"+date+"/bills").doc(bill.no).set({...bill,pending:false}),9000);f.b=1}
  if(!f.l&&bill.pay.udhar>0){await withTimeout(S.db.collection("ledger").doc(bill.no).set({ts:bill.ts,date,partyId:bill.partyId,partyName:bill.partyName,type:"udhar",amt:bill.pay.udhar,billNo:bill.no,by:bill.by,byName:bill.byName}),9000)}f.l=1;
  if(!f.c){const lastCart=bill.lines.filter(l=>!l.free).map(l=>({id:l.id,qty:l.qty})),lastItems=bill.lines.map(l=>l.name).slice(0,5).join(", ");
    try{if((bill.custPhone||"").length===10){const ref=S.db.collection("customers").doc(bill.custPhone);const g=await ref.get();const o=g.exists?g.data():{};await ref.set({name:bill.custName||o.name||"",phone:bill.custPhone,visits:(o.visits||0)+1,spent:r2((o.spent||0)+bill.total),firstTs:o.firstTs||bill.ts,lastTs:bill.ts,lastItems,lastCart})}
      else if(bill.mode==="udhar"&&bill.partyId)await S.db.collection("parties").doc(bill.partyId).update({lastCart,lastTs:bill.ts})}catch(e){}f.c=1}
  if(!f.s){if(!item.localStock)await adjStock(trackedPairs(bill.lines,-1),"बिल "+bill.no);else{for(const [id,d] of trackedPairs(bill.lines,-1)){try{await S.db.collection("pstock").doc(id).set({qty:SE.inc(r2(d)),ts:Date.now(),byName:bill.byName,last:"बिल "+bill.no},{merge:true})}catch(e){}}}f.s=1}
}
let flushing=false;
async function flushOutbox(){
  if(flushing||S.demo||!S.db)return;let o=outbox();if(!o.length){netbar();return}
  if(navigator.onLine===false){netbar();return}
  flushing=true;netbar("sync");let sent=0;
  for(const item of [...o]){try{await commitBill(item);o=outbox().filter(x=>x.bill.no!==item.bill.no);saveOutbox(o);sent++}catch(e){const cur=outbox();const i=cur.findIndex(x=>x.bill.no===item.bill.no);if(i>-1){cur[i].done=item.done;saveOutbox(cur)}break}}
  flushing=false;netbar();if(sent){toast("✅ "+sent+" बिल सर्वर पर भेज दिए");beat()}
}
function netbar(mode){
  const el=$("#netbar");if(!el)return;const n=outbox().length,off=navigator.onLine===false;
  if(mode==="sync"&&n){el.className="netbar sync";el.textContent="🔄 "+n+" बिल भेज रहे हैं…";el.hidden=false;return}
  if(off){el.className="netbar off";el.textContent="📴 इंटरनेट नहीं है — बिलिंग चालू है"+(n?" · "+n+" बिल फोन में सेव":"");el.hidden=false;return}
  if(n){el.className="netbar off";el.textContent="⏳ "+n+" बिल भेजने बाकी — इंटरनेट मिलते ही अपने-आप जाएँगे";el.hidden=false;return}
  el.hidden=true;
}
window.addEventListener("online",()=>{netbar();flushOutbox()});

/* ---------- guard: tamper alarm (owner-private fingerprints) ---------- */
const G={id:null,days:{},led:null,alarms:[],ready:false,okdel:new Set(),q:Promise.resolve(),mem:{}};
function guardQ(f){G.q=G.q.then(f).catch(()=>{});return G.q}
function fpBill(b){return [b.total,b.pay?.cash||0,b.pay?.upi||0,b.pay?.udhar||0,b.cancelled?1:0,b.disc||0,(b.lines||[]).map(l=>l.id+":"+l.qty+":"+l.rate).join(","),b.partyId||"",b.byName||""].join("|")}
function fpLed(l){return [l.type,l.amt,l.partyId,l.mode||"",l.billNo||""].join("|")}
function gref(n){return S.db.collection("data/users/"+G.id).doc(n)}
async function gget(n){if(S.demo)return G.mem[n]?JSON.parse(JSON.stringify(G.mem[n])):null;const x=await gref(n).get();return x.exists?x.data():null}
async function gset(n,d){if(S.demo){G.mem[n]=JSON.parse(JSON.stringify(d));return}await gref(n).set(d)}
function guardOpen(){return G.alarms.filter(a=>!a.seen).length}
async function guardAlarm(a){G.alarms.unshift({...a,at:Date.now(),seen:false});G.alarms=G.alarms.slice(0,200);await gset("g_alarms",{list:G.alarms});renderTabs();if(S.tab==="report")renderReport();beep(false);toast("🚨 पहरेदार: "+a.msg)}
async function guardInit(){
  if(!S.isOwner||G.ready)return;
  try{G.id=S.demo?"demo":(S.user&&S.user.id?await S.user.id():S.uid);if(!G.id)return;
    const a=await gget("g_alarms");G.alarms=(a&&a.list)||[];G.ready=true;renderTabs();
    if(!S.demo){for(let i=1;i<=3;i++){const x=new Date();x.setDate(x.getDate()-i);const d=today(x);try{const q=await S.db.collection("days/"+d+"/bills").get();await guardBills(d,q.docs.map(z=>z.data()))}catch(e){}}}
    await guardBills(S.billsDate,S.dayBills.filter(b=>!b.pending));await guardLedger();
  }catch(e){}
}
async function guardBills(date,bills){
  if(!G.ready)return;let g=G.days[date];if(!g){g=(await gget("g_"+date))||{m:{}};G.days[date]=g}
  let ch=false;const seen=new Set();
  for(const b of bills){if(b.pending)continue;seen.add(b.no);const fp=fpBill(b),o=g.m[b.no];
    if(!o){g.m[b.no]={fp,total:b.total,by:b.byName||"",ts:b.ts,c:b.cancelled?1:0};ch=true;continue}
    if(o.gone){o.gone=0;ch=true}
    if(o.fp!==fp){
      const ownerCancel=b.cancelled&&!o.c&&b.cancelledBy&&b.cancelledBy===S.uid;
      if(!ownerCancel)await guardAlarm({kind:"bill",date,no:b.no,by:b.byName||"",msg:`बिल ${b.no} (${b.byName||""}) बदला गया: पहले ${rs(o.total)}, अब ${rs(b.total)}${b.cancelled&&!o.c?" · रद्द किया गया":""}`});
      Object.assign(o,{fp,total:b.total,c:b.cancelled?1:0});ch=true}
  }
  for(const [no,o] of Object.entries(g.m)){if(!seen.has(no)&&!o.gone){o.gone=1;ch=true;await guardAlarm({kind:"gone",date,no,by:o.by,msg:`बिल ${no} (${o.by}, ${rs(o.total)}) ${fdate(date)} से गायब कर दिया गया`})}}
  if(ch)await gset("g_"+date,g);
}
async function guardLedger(){
  if(!G.ready)return;if(!G.led)G.led=(await gget("g_ledger"))||{m:{}};const g=G.led;let ch=false;const seen=new Set();
  for(const l of S.ledger){if(!l.id)continue;seen.add(l.id);const fp=fpLed(l),o=g.m[l.id];
    if(!o){g.m[l.id]={fp,amt:l.amt,type:l.type,party:l.partyName||"",by:l.byName||""};ch=true;continue}
    if(o.gone){o.gone=0;ch=true}
    if(o.fp!==fp){await guardAlarm({kind:"led",no:l.id,msg:`${o.party} के खाते की ${o.type==="udhar"?"उधार":"जमा"} एंट्री बदली गई: पहले ${rs(o.amt)}, अब ${rs(l.amt)}`});Object.assign(o,{fp,amt:l.amt});ch=true}
  }
  for(const [id,o] of Object.entries(g.m)){if(!seen.has(id)&&!o.gone){o.gone=1;ch=true;if(!G.okdel.has(id)&&!Object.values(G.days).some(d=>d.m[id]&&d.m[id].c))await guardAlarm({kind:"ledgone",no:id,msg:`${o.party} के खाते से ${rs(o.amt)} की ${o.type==="udhar"?"उधार":"जमा"} एंट्री मिटा दी गई (${o.by})`})}}
  if(ch)await gset("g_ledger",g);
}
function guardHTML(){
  if(!S.isOwner)return "";
  const open=G.alarms.filter(a=>!a.seen);
  if(!G.ready)return `<div class="card2"><h3>🛡️ पहरेदार</h3><p class="note" style="margin:0">चालू हो रहा है…</p></div>`;

    ${open.map(a=>`<div class="li" style="background:var(--surface);border-radius:12px;border:0"><div class="mid"><b>${esc(a.msg)}</b><span>पता चला: ${fdate(today(new Date(a.at)))} ${ftime(a.at)}</span></div></div>`).join("")}
    <p class="note" style="margin:0">ऐप से कर्मचारी कोई बिल नहीं बदल सकता। ऐसा बदलाव किसी ने ऐप के बाहर से किया है।</p>

/* ---------- day: stock, kharch, cash tally ---------- */
function stockRows(){
  const st=S.stock.items||{};
  return S.items.filter(i=>!i.track&&!i.virtual&&(i.active!==false||st[i.id])).map(it=>{
    const o=st[it.id]||{},open=+o.open||0,amt=+o.amt||0,waste=+o.waste||0,hasClose=o.close!==undefined&&o.close!=="";
    const close=hasClose?+o.close:null,sold=soldQty(it.id);
    const short=hasClose&&open>0?r2((open-waste-sold-close)*1000)/1000:null;
    const tol=it.unit==="kg"?0.1:0.99;
    return {it,open,amt,waste,close,sold,short,flag:short!=null&&short>tol,extra:short!=null&&short<-tol,buyRate:open>0&&amt>0?r2(amt/open):0,shortVal:short>0?r2(short*(+it.sale||0)):0};
  });
}
function cashCalc(d){
  const sale=liveBills().filter(b=>b.mode!=="inst");
  const cashSale=r2(sale.reduce((a,b)=>a+(b.pay.cash||0),0));

async function loadRange(n){
  S.range={n,loading:true};$("#rangeBox").innerHTML=rangeHTML();
  const ds=[];for(let i=n-1;i>=0;i--){const x=new Date();x.setDate(x.getDate()-i);ds.push(today(x))}
  try{
    const snaps=S.demo?ds.map(d=>d===today()?S.dayBills:[]):await Promise.all(ds.map(d=>S.db.collection("days/"+d+"/bills").get().then(s=>s.docs.map(x=>x.data())).catch(()=>[])));
    const items={};const days=ds.map((d,i)=>{const bl=snaps[i].filter(b=>!b.cancelled&&b.mode!=="inst");let profit=0;
      bl.forEach(b=>{profit-=(b.disc||0);b.lines.forEach(l=>{const o=items[l.id]||(items[l.id]={name:l.name,unit:l.unit,qty:0,amt:0,p:0,np:false});o.qty+=l.qty;o.amt+=l.amt;if(l.cost>0){const m=(l.rate-l.cost)*l.qty;o.p+=m;profit+=m}else o.np=true})});
      return {d,sale:r2(bl.reduce((a,b)=>a+b.total,0)),profit:r2(profit),n:bl.length}});
    const top=Object.values(items).sort((a,b)=>b.amt-a.amt).slice(0,12).map(o=>({...o,p:o.np&&!o.p?null:r2(o.p)}));
    S.range={n,days,top};
  }catch(e){S.range=null;toast("पुरानी बिक्री लोड नहीं हुई")}
  if(S.tab==="report")$("#rangeBox").innerHTML=rangeHTML();
}

    try{if(S.demo)S.items.push({id,...it});else await S.db.collection("items").doc(id).set(it);toast(name+" जुड़ गया · कोड "+code);renderSettings()}catch(err){toast("नहीं जुड़ा — सिर्फ मालिक जोड़ सकते हैं")}

function shrink(file){return new Promise((res,rej)=>{const img=new Image();const u=URL.createObjectURL(file);img.onload=()=>{const m=1000,sc=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(u);b?res(b):rej()},"image/jpeg",.86)};img.onerror=rej;img.src=u})}

  try{
    const o=window.SF?SF.rcptOpts(b,!b.pay||(b.pay.udhar>0)):{shop:"भैरव कैंटीन",date:fdate(b.date)+" "+ftime(b.ts),fq};

function reportA4(date){
  const all=S.dayBills.filter(b=>!b.cancelled),sale=all.filter(b=>b.mode!=="inst"),inst=all.filter(b=>b.mode==="inst");
  const sum=(a,f)=>r2(a.reduce((x,b)=>x+f(b),0));
  const per={};all.forEach(b=>(b.lines||[]).forEach(l=>{const k=l.id+"|"+(b.mode==="inst"?"i":"s");const p=per[k]||(per[k]={name:l.name,unit:l.unit,inst:b.mode==="inst",q:0,amt:0,cost:0});p.q=r2(p.q+l.qty);p.amt=r2(p.amt+(l.amt||0));p.cost=r2(p.cost+(l.cost||0)*l.qty)}));
  const rows=Object.values(per).sort((a,b)=>b.amt-a.amt);
  const kh=sum(S.kharch||[],k=>k.amt||0);
  const tr=(c)=>`<tr>${c.map((x,i)=>`<td${i&&typeof x!=="string"?' class="r"':""}>${x}</td>`).join("")}</tr>`;
  return `<h2>सारांश</h2><table>
  ${tr(["कुल बिक्री (ग्राहक)",rs(sum(sale,b=>b.total))])}${tr(["नकद",rs(sum(sale,b=>b.pay.cash||0))])}${tr(["UPI",rs(sum(sale,b=>b.pay.upi||0))])}${tr(["उधार में",rs(sum(sale,b=>b.pay.udhar||0))])}
  ${tr(["संस्थाओं को (खरीद रेट)",rs(sum(inst,b=>b.total))])}${tr(["खर्चा",rs(kh)])}${tr(["बिल",String(sale.length)+" + संस्था "+inst.length])}
  ${tr(["रद्द बिल",String(S.dayBills.filter(b=>b.cancelled).length)])}</table>
  <h2>सामान-वार</h2><table><tr><th>सामान</th><th class="r">मात्रा</th><th class="r">रकम</th><th class="r">खरीद लागत</th><th class="r">फायदा</th></tr>
  ${rows.map(p=>`<tr><td>${esc(p.name)}${p.inst?" (संस्था)":""}</td><td class="r">${fq(p.q,p.unit)}</td><td class="r">${rs(p.amt)}</td><td class="r">${rs(p.cost)}</td><td class="r">${p.inst?"—":rs(r2(p.amt-p.cost))}</td></tr>`).join("")}</table>
  ${window.SF?SF.purchA4HTML():""}
  <h2>सभी बिल</h2><table><tr><th>बिल</th><th>समय</th><th>ग्राहक</th><th>बिलर</th><th class="r">रकम</th><th>भुगतान</th></tr>
  ${S.dayBills.map(b=>`<tr><td>${esc(b.no)}</td><td>${ftime(b.ts)}</td><td>${esc(b.partyName||"")}</td><td>${esc(b.byName||"")}</td><td class="r">${rs(b.total)}</td><td>${b.cancelled?"रद्द":[b.pay.cash?"नकद "+rs(b.pay.cash):"",b.pay.upi?"UPI "+rs(b.pay.upi):"",b.pay.udhar?"उधार "+rs(b.pay.udhar):"",b.mode==="inst"?"संस्था":""].filter(Boolean).join(", ")}</td></tr>`).join("")}</table>`;
}
async function migrateOld(){
  if(!S.isOwner||S.demo){toast("सिर्फ मालिक");return}
  try{toast("पुराना डेटा ला रहे हैं…");const r=await fetch("migrate.json",{cache:"no-store"});const m=await r.json();let n=0,skip=0;
    for(const [col,docs] of Object.entries(m)){for(const [id,data] of Object.entries(docs)){const ref=S.db.collection(col).doc(id);const g=await ref.get();if(g.exists){skip++;continue}await ref.set(data);n++}}
    toast(`✓ ${n} चीज़ें आईं · ${skip} पहले से थीं (नहीं बदलीं)`)}catch(err){
    if(/permission/i.test(err.code||err.message||"")){const d=await SE.ownerDiag();toast(d.ok?"अनुमति अब ठीक है — दोबारा दबाएँ":"सर्वर ने मना किया: "+d.why);return}
    toast("नहीं आया: "+(err.message||err.code||""))}
}

function subBills(){
  if(window.SF)SF.onDate(S.billsDate);
  if(S.demo){renderPane();return}
  if(S.unsubBills)S.unsubBills();
  S.dayBills=[];
  S.unsubBills=S.db.collection("days/"+S.billsDate+"/bills").onSnapshot(s=>{const got=s.docs.map(d=>d.data()),nos=new Set(got.map(x=>x.no)),gd=S.billsDate;if(S.isOwner)guardQ(()=>guardBills(gd,got));S.dayBills=got.concat(outbox().map(x=>x.bill).filter(x=>x.date===S.billsDate&&!nos.has(x.no)));renderPane();if(S.tab==="bill")renderBill()},err=>toast("बिल लोड नहीं हुए"));
  S.unsubDay.forEach(f=>{try{f()}catch(e){}});S.stock={};S.kharch=[];S.close=null;const d="days/"+S.billsDate;
  S.unsubDay=[S.db.doc(d+"/meta/stock").onSnapshot(s=>{S.stock=s.exists?s.data():{};if(S.tab!=="day")renderPane()},()=>{}),
    S.db.collection(d+"/kharch").onSnapshot(s=>{S.kharch=s.docs.map(x=>({id:x.id,...x.data()}));renderPane(S.tab!=="day")},()=>{}),
    S.db.doc(d+"/meta/close").onSnapshot(s=>{S.close=s.exists?s.data():null;if(S.tab!=="day")renderPane()},()=>{})];
}
function loadDemo(){
  S.demo=true;S.isOwner=true;
  S.items=DEMO_ITEMS.map(([id,name,emoji,cat,unit,sale,cost,hue,barcode,sub,code,mrp],i)=>({id,name,emoji,cat,unit,sale,cost,hue,sub,code,mrp,alias:ALIAS[id]||"",barcode:barcode||"",track:!!barcode,min:5,order:i,active:true,photo:SE.bundled.has(id)?"b":""}));
  S.pstock={k1001:{qty:3},k1009:{qty:4},k1010:{qty:5},k1017:{qty:2},k1020:{qty:4},k1027:{qty:39},k1030:{qty:2},k1032:{qty:31}};
  S.parties=[{id:"jco",name:"JCO मेस",phone:""},{id:"officers",name:"अफसर मेस",phone:""}];
  S.settings={upi:"",payee:"Bhairav Canteen"};
}
async function boot(){
  S.staff=lsGet("se_staff");S.view=lsGet("se_view")||"grid";S.sortTop=lsGet("se_sort")!=="0";try{S.top7=JSON.parse(lsGet("se_top7")||"{}")}catch(e){S.top7={}}try{S.bt=JSON.parse(lsGet("se_tabs")||"[]")}catch(e){S.bt=[]}
  try{const old=JSON.parse(lsGet("se_held")||"[]");old.forEach(h=>S.bt.push({mode:h.mode,partyId:h.partyId,inst:h.inst,cust:h.cust,cart:h.cart,ts:h.ts}));lsSet("se_held","[]")}catch(e){}
  if(!S.bt.length)S.bt=[blankTab()];loadTab(0);
  renderTabs();showTab();
  let fb=null;try{fb=await SE.start()}catch(e){console.error(e)}
  if(!fb){loadDemo();showTab();if(!SE.configured)toast("डेमो मोड — Firebase अभी जुड़ा नहीं है");return}
  const db=fb.db;S.db=db;S.isOwner=fb.isOwner;S.uid=fb.uid;S.meName=fb.name;S.staff=fb.name;
  S.user={id:async()=>fb.uid,isOwner:async()=>fb.isOwner,me:async()=>({id:fb.uid,name:fb.name})};
  SE._busy=()=>S.saving||cartTotal()>0;
  renderTabs();
  SE.watchPhotos(()=>renderPane());
  if(window.SF)SF.onDb(db);
  if(window.SK)SK.onDb(db);
  if(S.isOwner)db.collection("staff").onSnapshot(s=>{S.staffDocs=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==="set"&&!$("#p-set").contains(document.activeElement))renderSettings()},()=>{});
  setTimeout(()=>SE.checkUpdate(toast),4000);
  const sortItems=a=>a.sort((x,y)=>(x.order??999)-(y.order??999)||x.name.localeCompare(y.name,"hi"));
  db.collection("items").onSnapshot(s=>{S.items=sortItems(s.docs.map(d=>({id:d.id,...d.data()})));if(window.SR)SR.addVirtual();if(S.isOwner&&window.SF&&S.items.some(i=>!i.plu))SF.ensurePLU();S.cart.forEach(l=>{const it=item(l.id);if(it&&!l.changed&&!l.free){l.board=priceOf(it);l.rate=l.board;l.cost=+it.cost||0;l.amt=r2(l.qty*l.rate)}});renderPane();renderCart()},()=>toast("सामान की लिस्ट लोड नहीं हुई"));
  db.doc("settings/main").onSnapshot(s=>{S.settings=s.exists?s.data():{};checkLock();if(S.tab!=="set")renderPane()});
  if(S.isOwner)db.collection("presence").onSnapshot(s=>{S.presence=s.docs.map(d=>d.data());if(S.tab==="bills")renderBills()},()=>{});
  setTimeout(()=>{flushOutbox();beat();netbar()},1500);
  if(S.isOwner)setTimeout(()=>guardQ(guardInit),2500);
  db.collection("parties").onSnapshot(s=>{S.parties=s.docs.map(d=>({id:d.id,...d.data()}));renderPane()});
  db.collection("ledger").onSnapshot(s=>{S.ledger=s.docs.map(d=>({id:d.id,...d.data()}));renderPane();if(S.isOwner)guardQ(guardLedger)});
  db.collection("pstock").onSnapshot(s=>{S.pstock={};s.docs.forEach(d=>S.pstock[d.id]=d.data());if(S.tab==="bill"&&!$("#p-bill").contains(document.activeElement))renderBill();if(S.tab==="day"&&!$("#p-day").contains(document.activeElement))renderDay()},()=>{});
  db.collection("customers").onSnapshot(s=>{S.customers=s.docs.map(d=>({id:d.id,...d.data()}));if(S.tab==="bill"&&!$("#p-bill").contains(document.activeElement))renderBill()},()=>{});
  if(S.isOwner)db.collection("priceLog").orderBy("ts","desc").limit(30).onSnapshot(s=>{S.priceLog=s.docs.map(d=>d.data())},()=>{});
  subBills();
  showTab();
  loadTop7();
}
async function loadTop7(){
  if(lsGet("se_top7d")===today()&&Object.keys(S.top7||{}).length)return;
  try{const ds=[];for(let i=0;i<=14;i++){const x=new Date();x.setDate(x.getDate()-i);ds.push(today(x))}
    const all=await Promise.all(ds.map(d=>S.db.collection("days/"+d+"/bills").get().then(q=>q.docs.map(x=>x.data())).catch(()=>[])));
    const sc={};all.flat().forEach(b=>{if(b.cancelled)return;const seen=new Set();(b.lines||[]).forEach(l=>{if(!seen.has(l.id)){seen.add(l.id);sc[l.id]=(sc[l.id]||0)+1}})});
    if(Object.keys(sc).length){S.top7=sc;lsSet("se_top7",JSON.stringify(sc));lsSet("se_top7d",today());if(S.tab==="bill"&&!$("#p-bill").contains(document.activeElement))renderBill()}
  }catch(e){}
}
