<html lang="en"><head><meta charset="utf-8">

<style>
:root{--bg:#f4f6f3;--card:#fff;--ink:#14181c;--mut:#667068;--line:#e4e8e3;--g:#0c831f;--g2:#0a6b19;--gbg:#e9f6ec;--y:#f8cb46;--r:#d93a2b;--sh:0 2px 10px rgba(16,40,20,.08)}
@media (prefers-color-scheme:dark){:root{--bg:#0d110e;--card:#171d18;--ink:#eef3ef;--mut:#9aa69c;--line:#2a332c;--gbg:#14301b;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{scroll-padding-top:140px}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 "Mukta","Noto Sans Devanagari",system-ui,sans-serif;padding-bottom:96px}
button{font:inherit;cursor:pointer;color:inherit}input,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:var(--y);padding:calc(8px + env(safe-area-inset-top)) 12px 8px;box-shadow:0 1px 0 rgba(0,0,0,.06)}
.brand{display:flex;align-items:center;gap:10px}.brand img{width:40px;height:40px;border-radius:10px;background:#fff}
.brand h1{margin:0;font:800 18px/1.1 "Baloo 2",sans-serif;color:#1a1a1a}.brand small{display:block;color:#3b3b2f;font-size:12.5px;font-weight:600}
.eta{margin-left:auto;text-align:right;color:#1a1a1a;white-space:nowrap}.brand>div:nth-child(2){min-width:0}.brand small{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.me{flex:none;display:grid;place-items:center;min-width:42px;height:42px;padding:0 8px;border:0;border-radius:99px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12);font:800 13px/1.05 "Baloo 2",sans-serif;color:#1a1a1a}.me small{display:block;font-size:10.5px;font-weight:800;color:var(--g2)}
.live{display:flex;align-items:center;gap:8px;margin:8px 12px 0;padding:10px 12px;border:0;width:calc(100% - 24px);text-align:left;border-radius:14px;background:var(--g);color:#fff;font-weight:700;box-shadow:var(--sh)}.live b{margin-left:auto;white-space:nowrap}
.ptsb{display:flex;align-items:center;gap:10px;background:linear-gradient(135deg,#fff4cf,#ffe08a);color:#3a2a00;border-radius:14px;padding:12px;margin-bottom:10px}.ptsb b{font:800 26px/1 "Baloo 2",sans-serif}.ptsb span{font-size:12.5px;font-weight:600}
.mo .st2{font-size:11px;font-weight:800;border-radius:99px;padding:1px 7px;background:var(--gbg);color:var(--g2)}.mo .st2.c{background:#fde8e6;color:var(--r)}.eta b{display:block;font:800 17px/1 "Baloo 2",sans-serif}.eta span{font-size:11px;font-weight:700}
.srch{margin-top:8px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:12px;padding:0 12px;height:44px;border:1px solid rgba(0,0,0,.08)}
.srch input{flex:1;border:0;outline:0;background:none;font-size:16px;color:#111;min-width:0}.srch svg{flex:none}
.trust{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:8px 12px 0}.trust span{flex:none;font-size:12px;font-weight:700;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:3px 9px;color:var(--mut)}
.closed{margin:8px 12px 0;background:#fff4e5;color:#7a4300;border-radius:12px;padding:8px 12px;font-weight:700;font-size:13px}
.cats{position:sticky;top:calc(108px + env(safe-area-inset-top));z-index:4;background:var(--bg);display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:10px 12px}
.cats button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 12px;font-weight:700;font-size:13.5px}
.cats button[aria-pressed=true]{background:var(--g);border-color:var(--g);color:#fff}
.sec{padding:4px 12px 2px;font:800 17px "Baloo 2",sans-serif;display:flex;align-items:baseline;gap:6px}.sec small{font:600 12px "Mukta",sans-serif;color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:6px 12px 10px}
@media(min-width:620px){.g{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(min-width:900px){.g{grid-template-columns:repeat(6,minmax(0,1fr))}}
.t{background:var(--card);border-radius:14px;box-shadow:var(--sh);border:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;position:relative}
.t.out{opacity:.55}.ph{aspect-ratio:1;background-size:cover;background-position:center;display:grid;place-items:center;font-size:34px;position:relative}
.off{position:absolute;top:0;left:8px;background:#2563eb;color:#fff;font:800 10.5px/1 sans-serif;padding:5px 4px 6px;border-radius:0 0 6px 6px;text-align:center;width:30px}
.b{padding:6px 7px 7px;display:flex;flex-direction:column;gap:2px;flex:1}.nm{font-weight:700;font-size:12.5px;line-height:1.2;text-transform:uppercase;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:30px}
.un{font-size:11.5px;color:var(--mut)}.hi{font-size:11.5px;color:var(--mut);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pr{display:flex;align-items:flex-end;justify-content:space-between;gap:4px;margin-top:auto;padding-top:4px}
.pr b{font-size:14px;display:block;line-height:1}.pr s{font-size:11px;color:var(--mut)}
.add{border:1.5px solid var(--g);background:var(--gbg);color:var(--g);font-weight:900;font-size:13px;border-radius:9px;height:32px;min-width:58px;padding:0 8px}
.stp{display:flex;align-items:center;background:var(--g);color:#fff;border-radius:9px;height:32px;min-width:66px;overflow:hidden}
.stp button{border:0;background:none;color:#fff;width:24px;height:32px;font-weight:900;font-size:16px;padding:0}.stp span{flex:1;text-align:center;font-weight:800;font-size:12.5px;white-space:nowrap}
.nostock{font-size:11px;font-weight:800;color:var(--r)}
.empty{text-align:center;color:var(--mut);padding:40px 16px}
.cbar{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;border:0;background:var(--g);color:#fff;border-radius:14px;display:flex;align-items:center;gap:10px;padding:10px 14px;box-shadow:0 6px 20px rgba(12,131,31,.35);max-width:620px;margin:0 auto}
.cbar[hidden]{display:none}.cbar .ic{font-size:22px}.cbar .tx{flex:1;text-align:left;line-height:1.15}.cbar .tx b{font-size:15px}.cbar .tx small{display:block;font-size:12px;opacity:.9}.cbar .go{font-weight:900;font-size:15px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:0 0 calc(90px + env(safe-area-inset-bottom))}
.sh{position:sticky;top:0;background:var(--bg);display:flex;align-items:center;gap:8px;padding:14px 14px 8px;z-index:2}.sh h2{margin:0;flex:1;font:800 18px "Baloo 2",sans-serif}
.x{border:0;background:var(--card);border-radius:99px;width:34px;height:34px;font-size:16px}
.box{background:var(--card);margin:8px 12px;border-radius:14px;padding:12px;border:1px solid var(--line)}.box h3{margin:0 0 8px;font-size:15px}
.ci{display:flex;align-items:center;gap:10px;padding:6px 0}.ci .ph{width:46px;height:46px;border-radius:10px;font-size:22px;flex:none;aspect-ratio:auto}.ci .nm{min-height:0;-webkit-line-clamp:2}.ci>div:nth-child(2){flex:1;min-width:0}
.ci .amt{font-weight:800;min-width:54px;text-align:right}
.row{display:flex;justify-content:space-between;padding:3px 0;font-size:14px}.row.tot{font-weight:900;font-size:16px;border-top:1px dashed var(--line);margin-top:4px;padding-top:8px}.row .fr{color:var(--g);font-weight:800}
.seg{display:flex;gap:8px}.seg button{flex:1;border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:9px 6px;font-weight:800;font-size:14px}.seg button[aria-pressed=true]{border-color:var(--g);background:var(--gbg);color:var(--g)}
.f{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg);font-size:16px;margin:4px 0}.f:focus{outline:0;border-color:var(--g)}
.loc{border:0;background:none;color:var(--g);font-weight:800;padding:4px 0}.hint{font-size:12.5px;color:var(--mut);margin:4px 0 0}
.place{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:11;max-width:620px;margin:0 auto;border:0;background:var(--g);color:#fff;border-radius:14px;padding:14px;font-weight:900;font-size:17px;box-shadow:0 6px 20px rgba(12,131,31,.35)}
.place:disabled{background:#8fa695;box-shadow:none}
.trk{display:grid;gap:0;margin:6px 0}.st{display:flex;gap:12px;align-items:flex-start;position:relative;padding-bottom:16px}.st:last-child{padding-bottom:0}
.st i{width:26px;height:26px;border-radius:99px;border:2px solid var(--line);background:var(--card);display:grid;place-items:center;font-style:normal;font-size:13px;flex:none;z-index:1}
.st:not(:last-child)::after{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--line)}
.st.done i{background:var(--g);border-color:var(--g);color:#fff}.st.done:not(:last-child)::after{background:var(--g)}.st.now i{border-color:var(--g);color:var(--g);animation:pl 1.4s infinite}
@keyframes pl{50%{box-shadow:0 0 0 6px rgba(12,131,31,.18)}}.st b{display:block;font-size:14.5px}.st small{color:var(--mut);font-size:12.5px}
.big{display:block;text-align:center;border:1.5px solid var(--g);color:var(--g);background:var(--card);border-radius:12px;padding:11px;font-weight:800;text-decoration:none;margin-top:8px}
.ok{font-size:54px;text-align:center}.mo{display:flex;justify-content:space-between;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding:8px 0}.mo:last-child{border:0}
.mo button{border:1.5px solid var(--g);background:var(--gbg);color:var(--g);border-radius:9px;padding:5px 9px;font-weight:800;font-size:13px}
.lnk{border:0;background:none;color:var(--g);font-weight:800;padding:0}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111;color:#fff;padding:9px 14px;border-radius:10px;font-size:14px;z-index:20;max-width:90vw}
.sk{background:linear-gradient(90deg,var(--line),var(--card),var(--line));background-size:200% 100%;animation:sk 1.2s infinite;border-radius:14px;height:190px}@keyframes sk{to{background-position:-200% 0}}
.locked #m,.locked .cats,.locked .trust{filter:blur(6px);pointer-events:none;user-select:none}.locked .srch{opacity:.5;pointer-events:none}
.wel{align-items:center}.wel .sheet{border-radius:20px;max-width:440px;margin:12px;padding-bottom:12px}.place.in{position:static;width:100%;margin-top:10px;box-shadow:none}
.safe{display:flex;gap:8px;background:var(--gbg);color:var(--ink);border-radius:12px;padding:10px;font-size:13px;margin-top:6px}.safe span{line-height:1.35}.safe.go{background:#fff4e0}
.acc{display:flex;align-items:center;justify-content:space-between;background:var(--bg);border-radius:12px;padding:8px 12px;margin-bottom:6px}.acc div{display:grid}.acc span{font-size:13px;color:var(--mut)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}.trust .accs{padding:0;border:0;background:none}.accs:empty{display:none}.accs .lnk{font-size:12px;font-weight:800;background:var(--gbg);border:1px solid var(--g);border-radius:99px;padding:3px 9px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:18px 12px 8px}
</style></head><body>
<div class="top"><div class="brand"><img src="../icon.png" alt=""><div><h1>Bhairav Canteen</h1><small id="sub">Jasai, Barmer</small></div><div class="eta" id="eta"></div><button class="me" id="me" type="button" aria-label="My account">👤</button></div>
<label class="srch"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" type="search" placeholder="Search — milk, Parle, samosa…" autocomplete="off" aria-label="Search items"></label></div>
<div id="livebar"></div><div class="trust" id="trust"></div><div id="closed"></div>
<nav class="cats" id="cats" aria-label="Categories"></nav>
<main id="m"><div class="g"><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></main>
<footer>Bhairav Canteen · Jasai, Barmer<br>Prices come live from the shop · <button class="lnk" id="myo" type="button">📦 My orders</button></footer>
<button class="cbar" id="cbar" hidden type="button"><span class="ic">🛒</span><span class="tx"><b id="cbN"></b><small id="cbS"></small></span><span class="go">View cart ›</span></button>
<div id="ov"></div>
<script src="../config.js"></script>
<script>
(function(){"use strict";
const C=(window.SE_CONFIG||{}).firebase||{},B="https://firestore.googleapis.com/v1/projects/"+C.projectId+"/databases/(default)/documents/";
const $=s=>document.querySelector(s),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const V=v=>{if(!v)return null;if("stringValue"in v)return v.stringValue;if("integerValue"in v)return +v.integerValue;if("doubleValue"in v)return v.doubleValue;if("booleanValue"in v)return v.booleanValue;if("nullValue"in v)return null;if("arrayValue"in v)return (v.arrayValue.values||[]).map(V);if("mapValue"in v){const o={};Object.entries(v.mapValue.fields||{}).forEach(([k,x])=>o[k]=V(x));return o}return null};
const U={kg:"kg",pc:"pc",dz:"dozen",pkt:"pack",pk:"pack",pl:"plate",l:"litre",gd:"bundle"};const stepOf=u=>u==="kg"?0.25:1;
const fq=(q,u)=>u==="kg"?(q<1?Math.round(q*1000)+"g":q+"kg"):q+(u==="pc"?"":" "+(U[u]||u));
const rs=n=>"₹"+(Math.round(n*100)/100).toLocaleString("en-IN");
const CATS=[["all","All","🛍️"],["mithai","Sweets","🍬"],["fast","Snacks","🥟"],["kirana","Grocery","🛒"],["daily","Daily Needs","🧴"],["sabzi","Fruits & Veg","🥬"],["stationery","Stationery","✏️"],["gift","Gifts & Toys","🎁"],["kapde","Clothing","👕"]];
const EM={mithai:"🍬",fast:"🥟",kirana:"🛒",daily:"🧴",sabzi:"🥬",stationery:"✏️",gift:"🎁",kapde:"👕"};
let R=null,CF={},L=[],cat="all",qs="",Q=LS.get("mh_cart",{}),me=LS.get("mh_me",{});
const toast=t=>{const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2600)};
const photo=i=>PH&&PH[i.id]?PH[i.id]:i.p?(/^(https?:|data:)/.test(i.p)?i.p:"../"+i.p):"";
const bg=i=>photo(i)?`background-image:url('${esc(photo(i))}')`:`background:linear-gradient(135deg,hsl(${(+i.h||((i.id||"").length*47))%360} 70% 92%),hsl(${(+i.h||((i.id||"").length*47))%360} 60% 80%))`;
const openNow=()=>{if(!CF.open||!CF.close)return true;const n=new Date(),m=n.getHours()*60+n.getMinutes(),p=s=>{const[a,b]=String(s).split(":");return(+a)*60+(+b||0)};return m>=p(CF.open)&&m<p(CF.close)};
const tot=()=>L.reduce((a,i)=>a+(Q[i.id]||0)*i.s,0),cnt=()=>L.filter(i=>Q[i.id]>0).length;
const fee=sub=>!CF.del||mode()!=="d"?0:(CF.freeAbove&&sub>=CF.freeAbove?0:(+CF.fee||0));
let MODE=LS.get("mh_mode","d");const mode=()=>CF.del===false?"p":CF.pick===false?"d":MODE;

async function load(){const cached=LS.get("mh_rates",null);if(cached&&!R){R=cached;prep();draw()}
  try{const r=await fetch(B+"pub/rates?key="+C.apiKey,{cache:"no-store"});if(!r.ok)throw 0;R=V({mapValue:{fields:(await r.json()).fields||{}}});LS.set("mh_rates",R);prep();draw()}
  catch(e){if(!R)$("#m").innerHTML='<div class="empty">📶 Could not load prices — check internet and <button class="lnk" onclick="location.reload()">try again</button></div>'}}
function prep(){CF=R.cfg||{};L=(R.items||[]).filter(i=>i&&i.id&&+i.s>0&&!(CF.stockOnly&&i.k===0));
  Object.keys(Q).forEach(id=>{const i=L.find(x=>x.id===id);if(!i||i.k===0)delete Q[id]});
  const ph=String(CF.phone||R.phone||"");
  $("#eta").innerHTML=CF.on===false?"":`<b>⚡ ${+CF.eta||30} min</b><span>${mode()==="d"?"delivery":"pickup"}</span>`;
  $("#trust").innerHTML='<span id="acc" class="accs"></span>'+[`✅ Army canteen`,`🏷️ Same price as shop`,CF.freeAbove?`🛵 Free delivery above ₹${CF.freeAbove}`:"",`💵 Cash / 📱 UPI`,ph?`<a href="tel:+91${esc(ph)}" style="color:inherit;text-decoration:none">📞 ${esc(ph)}</a>`:""].filter(Boolean).map(x=>`<span>${x}</span>`).join("");accChip();
  $("#closed").innerHTML=CF.on===false?`<div class="closed">⛔ Online orders are paused right now — please visit or call the shop.</div>`:!openNow()?`<div class="closed">🌙 Shop is closed now (open ${esc(CF.open)}–${esc(CF.close)}). You can still order — we will prepare it when we open.</div>`:"";
  const have=new Set(L.map(i=>i.c));$("#cats").innerHTML=CATS.filter(c=>c[0]==="all"||have.has(c[0])).map(c=>`<button type="button" data-c="${c[0]}" aria-pressed="${cat===c[0]}">${c[2]} ${c[1]}</button>`).join("")}
function card(i){const q=Q[i.id]||0,off=i.m>i.s?Math.round((i.m-i.s)/i.m*100):0,out=i.k===0;
  return `<div class="t${out?" out":""}"><div class="ph" style="${bg(i)}">${photo(i)?"":(i.em||EM[i.c]||"🛍️")}${off>=3?`<span class="off">${off}%<br>OFF</span>`:""}</div>
  <div class="b"><div class="nm">${esc(i.n)}</div>${i.hi?`<div class="hi">${esc(i.hi)}</div>`:""}<div class="un">${i.u==="kg"?"per kg":esc(i.sz||"1 "+(U[i.u]||i.u))}</div>
  <div class="pr"><div><b>${rs(i.s)}</b>${off?`<s>${rs(i.m)}</s>`:""}</div>${out?`<span class="nostock">Sold out</span>`:q?`<div class="stp"><button type="button" data-m="${esc(i.id)}" aria-label="Less">−</button><span>${fq(q,i.u)}</span><button type="button" data-p="${esc(i.id)}" aria-label="More">+</button></div>`:`<button type="button" class="add" data-p="${esc(i.id)}" ${CF.on===false?"disabled":""}>ADD</button>`}</div></div></div>`}
function draw(){if(!R)return;const s=qs.toLowerCase();
  let F=L.filter(i=>(cat==="all"||i.c===cat)&&(!s||(i.n+" "+(i.hi||"")+" "+(i.e||"")+" "+(i.sb||"")).toLowerCase().includes(s)));
  F.sort((a,b)=>(a.k===0)-(b.k===0)||(b.t||0)-(a.t||0));
  let html="";if(!F.length)html=`<div class="empty">😕 No match for "${esc(qs)}" — try another name or call the shop.</div>`;
  else if(cat==="all"&&!s){CATS.slice(1).forEach(c=>{const G=F.filter(i=>i.c===c[0]);if(G.length)html+=`<div class="sec">${c[2]} ${c[1]} <small>${G.length} items</small></div><div class="g">${G.slice(0,60).map(card).join("")}</div>`});
    const rest=F.filter(i=>!CATS.some(c=>c[0]===i.c));if(rest.length)html+=`<div class="sec">🛍️ More <small>${rest.length}</small></div><div class="g">${rest.map(card).join("")}</div>`}
  else html=`<div class="g">${F.slice(0,300).map(card).join("")}</div>`;
  $("#m").innerHTML=html;bar()}
function bar(){const n=cnt(),b=$("#cbar");LS.set("mh_cart",Q);b.hidden=!n;if(!n)return;const t=tot();$("#cbN").textContent=n+(n>1?" items · ":" item · ")+rs(t);
  const f=CF.freeAbove&&mode()==="d"&&t<CF.freeAbove?`Add ₹${Math.ceil(CF.freeAbove-t)} more for free delivery`:mode()==="d"?"Home delivery":"Pickup from shop";$("#cbS").textContent=f}
function bump(id,dir){const i=L.find(x=>x.id===id);if(!i||i.k===0)return;const s=stepOf(i.u);let q=Math.round(((Q[id]||0)+dir*s)*100)/100;
  if(q<0)q=0;if(q>99)q=99;if(q)Q[id]=q;else delete Q[id];try{if(dir>0&&navigator.vibrate)navigator.vibrate(12)}catch(e){}}
document.addEventListener("click",e=>{const p=e.target.closest("[data-p]"),m=e.target.closest("[data-m]");
  if(p||m){bump((p||m).dataset[p?"p":"m"],p?1:-1);if(e.target.closest("#ov"))cart();else draw();return}
  const c=e.target.closest("[data-c]");if(c){cat=c.dataset.c;document.querySelectorAll("#cats button").forEach(b=>b.setAttribute("aria-pressed",String(b===c)));draw();window.scrollTo({top:0,behavior:"smooth"});return}});
$("#q").addEventListener("input",e=>{qs=e.target.value.trim();draw()});
$("#cbar").onclick=()=>cart();$("#myo").onclick=()=>myOrders();
const close=()=>{$("#ov").innerHTML="";document.body.style.overflow="";if(!ACC().ph)setTimeout(()=>{if(!ACC().ph&&!$("#ov .sheet"))welcome(false)},50)};
const sheet=(title,body,btn)=>{$("#ov").innerHTML=`<div class="scrim" data-x><div class="sheet" role="dialog" aria-label="${esc(title)}"><div class="sh"><h2>${title}</h2><button class="x" type="button" data-x aria-label="Close">✕</button></div>${body}</div>${btn||""}</div>`;document.body.style.overflow="hidden";
  $("#ov .scrim").addEventListener("click",e=>{if(e.target.matches("[data-x]")){clearTimeout(trkT);close()}})};

/* ---------- 🛒 कार्ट + चेकआउट ---------- */
function cart(){const I=L.filter(i=>Q[i.id]>0);if(!I.length){close();draw();return}const sub=tot(),fe=fee(sub),total=sub+fe,min=+CF.min||0;
  const minOk=sub>=min;
  sheet("🛒 Your cart",`<div class="box">${I.map(i=>`<div class="ci"><div class="ph" style="${bg(i)}">${photo(i)?"":(i.em||EM[i.c]||"🛍️")}</div><div><div class="nm">${esc(i.n)}</div><div class="un">${rs(i.s)} / ${U[i.u]||i.u}</div></div>
    <div class="stp"><button type="button" data-m="${esc(i.id)}">−</button><span>${fq(Q[i.id],i.u)}</span><button type="button" data-p="${esc(i.id)}">+</button></div><div class="amt">${rs(Q[i.id]*i.s)}</div></div>`).join("")}</div>
  <div class="box"><h3>🧾 Bill details</h3><div class="row"><span>Items total</span><span>${rs(sub)}</span></div>
    ${mode()==="d"?`<div class="row"><span>Delivery fee</span>${fe?`<span>${rs(fe)}</span>`:`<span class="fr">FREE</span>`}</div>`:""}
    <div class="row tot"><span>To pay (approx.)</span><span>${rs(total)}</span></div>
    <p class="hint">Items sold by weight (sweets, veg) are billed after weighing. ${CF.freeAbove&&mode()==="d"&&sub<CF.freeAbove?`Add <b>₹${Math.ceil(CF.freeAbove-sub)}</b> more for free delivery.`:""}</p></div>
  <div class="box"><h3>🛵 Delivery or pickup?</h3><div class="seg">${CF.del!==false?`<button type="button" data-mode="d" aria-pressed="${mode()==="d"}">🛵 Home delivery</button>`:""}${CF.pick!==false?`<button type="button" data-mode="p" aria-pressed="${mode()==="p"}">🏪 Pickup</button>`:""}</div></div>
  <div class="box"><h3>👤 Order for</h3>
    <div class="acc"><div><b>${esc(ACC().nm)}</b><span>📱 ${esc(ACC().ph)}</span></div><button type="button" class="lnk" data-chacc>✏️ Change</button></div>
    <input class="f" id="alt" placeholder="📞 Number to call for delivery (if different)" inputmode="tel" maxlength="14" value="${esc(me.alt||"")}">
    ${mode()==="d"?`<h3 style="margin:10px 0 4px">📍 Delivery address</h3>
    <div class="two"><input class="f" id="qt" placeholder="Quarter No. (e.g. 12/B)" maxlength="16" value="${esc(me.qt||"")}"><input class="f" id="un" placeholder="Unit (e.g. 177 MH)" maxlength="24" value="${esc(me.un||"")}"></div>
    <input class="f" id="ad" placeholder="Area / Lines (e.g. JCO Lines, near temple)" maxlength="36" autocomplete="street-address" value="${esc(me.ad||"")}">
    <button type="button" class="loc" id="loc">📍 ${me.ll?"Location added ✓ — update":"Add my location (faster delivery)"}</button>`:""}
    <div class="seg" style="margin-top:8px">${["Now","Evening 6-8"].map((w,k)=>`<button type="button" data-when="${w}" aria-pressed="${(me.when||"Now")===w}">⏰ ${w}</button>`).join("")}</div>
    <div class="seg" style="margin-top:8px">${[["c","💵 Cash"],["u","📱 UPI"]].map(([k,v])=>`<button type="button" data-pay="${k}" aria-pressed="${(me.pay||"c")===k}">${v}</button>`).join("")}</div>
    <textarea class="f" id="nt" rows="2" maxlength="120" placeholder="Any instructions? (optional)"></textarea></div>`,
  `<button class="place" id="place" type="button" ${minOk&&CF.on!==false?"":"disabled"}>${CF.on===false?"Online orders paused":minOk?`✓ Place order · ${rs(total)}`:`Minimum order ${rs(min)}`}</button>`);
  const keep=()=>{const g=id=>{const x=$("#"+id);return x?x.value.trim():undefined};["alt","qt","un","ad"].forEach(k=>{const v=g(k);if(v!==undefined)me[k]=v});LS.set("mh_me",me)};
  const sc=$("#ov .scrim");sc.addEventListener("input",keep);
  sc.addEventListener("click",e=>{const t=e.target;let b;
    if(t.closest("[data-chacc]")){keep();welcome(true);return}
    if((b=t.closest("[data-mode]"))){keep();MODE=b.dataset.mode;LS.set("mh_mode",MODE);cart();return}
    if((b=t.closest("[data-when]"))){me.when=b.dataset.when;keep();b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));return}
    if((b=t.closest("[data-pay]"))){me.pay=b.dataset.pay;keep();b.parentNode.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",String(x===b)));return}
    if(t.closest("#loc")){keep();if(!navigator.geolocation){toast("Location not available on this phone");return}t.textContent="📍 Finding location…";
      navigator.geolocation.getCurrentPosition(p=>{me.ll=p.coords.latitude.toFixed(5)+","+p.coords.longitude.toFixed(5);LS.set("mh_me",me);t.textContent="📍 Location added ✓";toast("📍 Location added")},()=>{t.textContent="📍 Could not get location — please type address"},{enableHighAccuracy:true,timeout:12000})}
    if(t.closest("#place"))place()});
}
async function place(){const A=ACC();if(!A.ph){welcome(false);return}const nm=A.nm,ph=A.ph,g=id=>($("#"+id)?$("#"+id).value.trim():""),nt=g("nt"),alt=g("alt").replace(/\D/g,"").slice(-10);
  const qt=g("qt"),un=g("un"),ar=g("ad"),ad=[qt?"Qtr "+qt:"",un,ar].filter(Boolean).join(" · ");
  if(mode()==="d"&&!qt&&!me.ll){toast("Add Quarter No. or 📍 location");if($("#qt"))$("#qt").focus();return}
  if(alt&&alt.length!==10){toast("Call number must be 10 digits");$("#alt").focus();return}
  const I=L.filter(i=>Q[i.id]>0).slice(0,40),sub=tot(),total=Math.round((sub+fee(sub))*100)/100;
  const meta=[mode()==="d"?"🛵":"🏪",(me.pay||"c")==="u"?"📱":"💵","⏰ "+(me.when||"Now"),me.ll&&mode()==="d"?"📍"+me.ll:"",alt&&alt!==ph?"☎️"+alt:"","₹"+total].filter(Boolean).join("|");
  const note=(meta+"¦"+nt).slice(0,200);const btn=$("#place");btn.disabled=true;btn.textContent="⏳ Placing order…";
  const S=v=>({stringValue:String(v)});const ts=Date.now();
  const body={fields:{name:S(nm.slice(0,40)),phone:S(ph),addr:S((mode()==="d"?ad:"Pickup from shop").slice(0,80)),note:S(note),ts:{integerValue:String(ts)},status:S("new"),src:S("web2"),
    items:{arrayValue:{values:I.map(i=>({mapValue:{fields:{id:S(i.id),n:S(i.n),q:{doubleValue:Q[i.id]},u:S(i.u),s:{doubleValue:+i.s}}}}))}}}};
  try{const r=await fetch(B+"orders?key="+C.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw new Error(r.status);
    const j=await r.json();const id=String(j.name||"").split("/").pop();
    const mine=LS.get("mh_orders",[]);mine.unshift({id,ts,total,n:I.length,items:I.map(i=>[i.id,Q[i.id]]),mode:mode()});LS.set("mh_orders",mine.slice(0,20));
    Q={};LS.set("mh_cart",Q);draw();track(id,true)}
  catch(e){btn.disabled=false;btn.textContent="✓ Place order";toast("Order not sent — check internet and try again")}}

/* ---------- 📦 ट्रैकिंग (pub/ot_<id> — दुकान का ऐप हर कदम पर भरता है) ---------- */
const STEPS=[["new","Order placed","Received at the shop"],["acc","Accepted","The shop has confirmed your order"],["pack","Packing","Your items are being packed"],["out","On the way","🛵 Coming to you"],["done","Delivered","Thank you! 🙏"]];
let trkT=0;
async function track(id,fresh){clearTimeout(trkT);const o=LS.get("mh_orders",[]).find(x=>x.id===id)||{ts:Date.now()};let t={};
  try{const r=await fetch(B+"pub/ot_"+id+"?key="+C.apiKey,{cache:"no-store"});if(r.ok)t=V({mapValue:{fields:(await r.json()).fields||{}}})||{}}catch(e){}
  const st=t.st||"new";saveSt(id,st,t);const ix=st==="cancel"?-1:Math.max(0,STEPS.findIndex(s=>s[0]===st)),ph=String(CF.phone||R&&R.phone||"");
  const eta=t.eta?new Date(+t.eta).toLocaleTimeString("en-IN",{hour:"numeric",minute:"2-digit"}):"";
  sheet(fresh?"✅ Order placed":"📦 Order status",`${fresh?`<div class="ok">✅</div>`:""}
   <div class="box">${st==="cancel"?`<b style="color:var(--r)">✕ Order cancelled</b>${t.msg?`<p class="hint">${esc(t.msg)}</p>`:""}`:`
     ${eta&&ix<4?`<p style="margin:0 0 10px;font-size:16px">⏱️ ${o.mode==="p"?"Ready by":"Arriving by"} about <b>${eta}</b></p>`:""}
     <div class="trk">${STEPS.filter(s=>o.mode!=="p"||s[0]!=="out").map((s,k,A)=>{const i2=STEPS.indexOf(s);return `<div class="st ${i2<ix||st==="done"?"done":i2===ix?"now":""}"><i>${i2<ix||st==="done"?"✓":k+1}</i><div><b>${s[1]}</b><small>${i2===ix&&t.msg?esc(t.msg):s[2]}${i2===1&&t.by&&ix>=1?" · "+esc(t.by):""}</small></div></div>`}).join("")}</div>`}</div>
   <div class="box"><div class="row"><span>Order</span><b>#${esc(String(id).slice(-6).toUpperCase())}</b></div><div class="row"><span>Total (approx.)</span><b>${rs(o.total||0)}</b></div>${t.billNo?`<div class="row"><span>Bill</span><b>${esc(t.billNo)}</b></div>`:""}
   ${ph?`<a class="big" href="tel:+91${esc(ph)}">📞 Call the shop</a><a class="big" href="https://wa.me/91${esc(ph)}?text=${encodeURIComponent("Hello, about my order #"+String(id).slice(-6).toUpperCase())}" target="_blank" rel="noopener">💬 WhatsApp</a>`:""}</div>`);
  if(st!=="done"&&st!=="cancel"&&$("#ov .sheet"))trkT=setTimeout(()=>{if($("#ov .sheet"))track(id,false)},15000)}
function ptsHTML(){const P=LS.get("mh_pts",null);return P&&P.n>0?`<div class="ptsb"><span style="font-size:30px">🎁</span><div><b>${P.n}</b> <span>points collected!</span><br><span>1 point on every ₹${P.per||100} you shop · ask the shop for your reward</span></div></div>`:`<div class="ptsb"><span style="font-size:30px">🎁</span><div><span><b style="font-size:15px">Collect points</b><br>Get 1 point on every ₹100 you shop — rewards from the shop!</span></div></div>`}
function myOrders(){const M=LS.get("mh_orders",[]),A=ACC();sheet("📦 My orders",`${A.ph?`<div class="box acc"><div><b>👤 ${esc(A.nm)}</b><span>📱 ${esc(A.ph)}</span></div><button type="button" class="lnk" data-chacc2>Edit ›</button></div>`:""}${ptsHTML()}<div class="box">${M.length?M.map(o=>`<div class="mo"><div><b>#${esc(String(o.id).slice(-6).toUpperCase())}</b> ${o.st==="done"?'<span class="st2">✓ Delivered</span>':o.st==="cancel"?'<span class="st2 c">Cancelled</span>':""} · ${o.n} items · ${rs(o.total)}<br><small class="hint">${new Date(o.ts).toLocaleString("en-IN",{day:"numeric",month:"short",hour:"numeric",minute:"2-digit"})}</small></div>
  <div style="display:flex;gap:6px"><button type="button" data-trk="${esc(o.id)}">Status</button><button type="button" data-again="${esc(o.id)}">↻ Reorder</button></div></div>`).join(""):'<p class="hint">No orders yet.</p>'}</div>`);
  $("#ov .scrim").addEventListener("click",e=>{const t=e.target.closest("[data-trk]"),a=e.target.closest("[data-again]");if(t)track(t.dataset.trk,false);
    if(a){const o=M.find(x=>x.id===a.dataset.again);(o.items||[]).forEach(([id,q])=>{const i=L.find(x=>x.id===id);if(i&&i.k!==0)Q[id]=q});close();draw();toast("🛒 Added to cart — at today\u2019s prices")}})}
/* 🟢 चालू ऑर्डर: अपने-आप पॉप-अप नहीं — ऊपर छोटी पट्टी (पहुँच गया/रद्द हो तो कुछ नहीं) */
function saveSt(id,st,t){const M=LS.get("mh_orders",[]),o=M.find(x=>x.id===id);if(o){o.st=st;LS.set("mh_orders",M)}
  if(t&&t.pts!=null&&isFinite(+t.pts)){LS.set("mh_pts",{n:+t.pts,per:+t.ptsPer||100,ts:Date.now()});meBtn()}liveBar()}
const ACTIVE=o=>o&&o.st!=="done"&&o.st!=="cancel"&&Date.now()-o.ts<12*3600e3;
function liveBar(){const o=LS.get("mh_orders",[]).find(ACTIVE),el=$("#livebar");if(!el)return;
  el.innerHTML=o?`<button class="live" type="button" data-trk="${esc(o.id)}">${o.mode==="p"?"🏪":"🛵"} Your order #${esc(String(o.id).slice(-6).toUpperCase())} · ${({acc:"Accepted",pack:"Packing",out:"On the way"})[o.st]||"Placed"}<b>Track ›</b></button>`:""}
document.addEventListener("click",e=>{const t=e.target.closest("#livebar [data-trk]");if(t)track(t.dataset.trk,false)});
async function peek(){const M=LS.get("mh_orders",[]).filter(o=>ACTIVE(o)||o.st==null&&Date.now()-o.ts<7*86400e3).slice(0,3);
  for(const o of M){try{const r=await fetch(B+"pub/ot_"+o.id+"?key="+C.apiKey,{cache:"no-store"});if(!r.ok)continue;const t=V({mapValue:{fields:(await r.json()).fields||{}}})||{};saveSt(o.id,t.st||"new",t)}catch(e){}}liveBar()}
liveBar();setTimeout(peek,800);setInterval(()=>{if(LS.get("mh_orders",[]).some(ACTIVE))peek()},60000);
/* ---------- 👤 खाता (बिना OTP): नाम + मोबाइल — दुकान को रिपोर्ट (orders, src:"signup") ---------- */
function ACC(){return LS.get("mh_acc",{})}
/* पुराने ग्राहक (खाते से पहले ऑर्डर किया): उनका नाम-नंबर पहले से याद है — दोबारा न पूछें */
(function(){const A=ACC();if(A.ph)return;const m=LS.get("mh_me",{}),ph=String(m.ph||"").replace(/\D/g,"").slice(-10);
  if(ph.length===10&&/^[6-9]/.test(ph))LS.set("mh_acc",{nm:String(m.nm||"Customer").slice(0,40),ph,ts:Date.now(),from:"old"})})();
function meBtn(){const A=ACC(),P=LS.get("mh_pts",null),b=$("#me");if(!b)return;
  b.innerHTML=A.ph?`<span>👤 ${esc(String(A.nm).split(" ")[0].slice(0,9))}</span>${P&&P.n>0?`<small>🎁 ${P.n} pts</small>`:""}`:"👤 <small>Sign in</small>"}
document.addEventListener("click",e=>{if(e.target.closest("#me")){ACC().ph?myOrders():welcome(false)}});
async function report(nm,ph,old){const S=v=>({stringValue:String(v)});
  const body={fields:{name:S(nm.slice(0,40)),phone:S(ph),addr:S(""),note:S(("👤"+(old&&old!==ph?"|old:"+old:"")+"|ua:"+(navigator.userAgent.match(/\(([^)]+)\)/)||["",""])[1]).slice(0,200)),ts:{integerValue:String(Date.now())},status:S("new"),src:S("signup"),
    items:{arrayValue:{values:[{mapValue:{fields:{id:S("signup"),n:S(old&&old!==ph?"Number changed":"New account"),q:{doubleValue:1},u:S("pc"),s:{doubleValue:0}}}}]}}}};
  try{const r=await fetch(B+"orders?key="+C.apiKey,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(!r.ok)throw 0;LS.set("mh_pend",null);return true}
  catch(e){LS.set("mh_pend",{nm,ph,old});return false}}
function lock(on){document.body.classList.toggle("locked",!!on)}
function welcome(change){const A=ACC();lock(!A.ph);
  $("#ov").innerHTML=`<div class="scrim wel"${A.ph?" data-x":""}><div class="sheet" role="dialog" aria-label="Welcome"><div class="sh"><h2>${change?"✏️ Update your details":"👋 Welcome to Bhairav Canteen"}</h2>${A.ph?'<button class="x" type="button" data-x aria-label="Close">✕</button>':""}</div>
    <div class="box"><p style="margin:0 0 8px">${change?"Change your name or number below.":"Order sweets, snacks and groceries from home. Tell us who you are so we can deliver to you."}</p>
    <input class="f" id="wnm" placeholder="Your name" maxlength="40" autocomplete="name" value="${esc(A.nm||"")}">
    <input class="f" id="wph" placeholder="Mobile number (10 digits)" inputmode="tel" maxlength="14" autocomplete="tel" value="${esc(A.ph||"")}">
    <div class="safe">📞 <span>Your number helps us <b>confirm your items and reach your door</b>.</span></div><div class="safe go">🛵 <span>Fresh from our shop, <b>straight to your door</b> — quick and hassle-free.</span></div>
    <button class="place in" id="wgo" type="button">${change?"Save":"Continue →"}</button></div></div></div>`;
  const sc=$("#ov .scrim");sc.addEventListener("click",async e=>{if(e.target.matches("[data-x]")&&ACC().ph){close();return}
    if(!e.target.closest("#wgo"))return;const nm=$("#wnm").value.trim(),ph=$("#wph").value.replace(/\D/g,"").slice(-10);
    if(nm.length<2){toast("Please enter your name");$("#wnm").focus();return}if(ph.length!==10||!/^[6-9]/.test(ph)){toast("Enter a valid 10-digit mobile number");$("#wph").focus();return}
    const old=A.ph||"";const b=e.target.closest("#wgo");b.disabled=true;b.textContent="⏳ …";
    if(old!==ph||A.nm!==nm||!A.ts)await report(nm,ph,old);LS.set("mh_acc",{nm,ph,ts:A.ts||Date.now()});me.nm=nm;me.ph=ph;LS.set("mh_me",me);
    close();lock(false);accChip();draw();toast(change?"✓ Details updated":"👋 Welcome, "+nm.split(" ")[0]+"!")});
  setTimeout(()=>{const x=$("#wnm");if(x&&!A.nm)x.focus()},200)}
function accChip(){meBtn()}/* नाम अब ऊपर 👤 बटन में */
document.addEventListener("click",e=>{if(e.target.closest("[data-chacc2]"))welcome(true)});
(function(){const P=LS.get("mh_pend",null);if(P)report(P.nm,P.ph,P.old)})();/* बिना नेट बना खाता — अब भेजो */
/* ---------- 📸 असली फोटो: pub/ph_<n> (112px, ~4 KB) पीछे से आती रहें ---------- */
const PH=LS.get("mh_ph",{});let phT=0;
async function loadPhotos(){try{const r=await fetch(B+"pub/phx?key="+C.apiKey,{cache:"no-store"});if(!r.ok)return;const x=V({mapValue:{fields:(await r.json()).fields||{}}})||{};
  const n=+x.n||0,v=String(x.v||"");if(!n)return;if(LS.get("mh_phv","")===v&&Object.keys(PH).length){return}
  for(let k=0;k<n;k++){try{const q=await fetch(B+"pub/ph_"+k+"?key="+C.apiKey);if(!q.ok)continue;const d=V({mapValue:{fields:(await q.json()).fields||{}}})||{};Object.assign(PH,d.m||{});clearTimeout(phT);phT=setTimeout(()=>{if(!$("#ov .sheet"))draw()},150)}catch(e){}}
  try{LS.set("mh_ph",PH);LS.set("mh_phv",v)}catch(e){}}catch(e){}}
if(!ACC().ph)welcome(false);else accChip();meBtn();
load();loadPhotos();setInterval(()=>{if(!$("#ov .sheet"))load()},5*60000);
})();
</script></body></html>
